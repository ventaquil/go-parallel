name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to Go Proxy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.18'

    - name: Run tests
      run: go test -v ./...

    - name: Trigger Go Proxy and pkg.go.dev
      run: |
        VERSION="${GITHUB_REF#refs/tags/}"
        MODULE="github.com/ventaquil/go-parallel"
        
        echo "Fetching $MODULE@$VERSION"
        
        # Fetch from proxy to trigger indexing
        curl -fsSL "https://proxy.golang.org/$MODULE/@v/$VERSION.info" || true
        curl -fsSL "https://proxy.golang.org/$MODULE/@v/$VERSION.mod" || true
        
        # Use go get to ensure full indexing chain
        GOPROXY=https://proxy.golang.org go list -m $MODULE@$VERSION || true
        
        echo "Package: $MODULE@$VERSION"
        echo "Documentation: https://pkg.go.dev/$MODULE@$VERSION"
