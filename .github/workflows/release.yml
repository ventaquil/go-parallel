name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to Go Proxy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.18'

    - name: Run tests
      run: go test -v ./...

    - name: Trigger Go Proxy
      run: |
        VERSION="${GITHUB_REF#refs/tags/}"
        curl -fsSL "https://proxy.golang.org/github.com/ventaquil/go-parallel/@v/$VERSION.info" || true
        echo "Package: github.com/ventaquil/go-parallel@$VERSION"

    - name: Request pkg.go.dev indexing
      run: |
        VERSION="${GITHUB_REF#refs/tags/}"
        echo "Requesting pkg.go.dev to index $VERSION"
        curl -fsSL "https://pkg.go.dev/github.com/ventaquil/go-parallel@$VERSION" > /dev/null || true
        echo "Indexing requested for: https://pkg.go.dev/github.com/ventaquil/go-parallel@$VERSION"
